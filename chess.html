<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Layout Revision</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        .board{
            height:400px;
            width: 400px;
            border: 2px solid black;
            background-color: black;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
        }
        .white{
            background-color: white;
        }
    </style>
</head>
<body>


    <div class="board">
        <div class="white"></div>
        <div></div>
        <div class="white"></div>
        <div></div>
        <div ></div>
        <div class="white"></div>
        <div></div>
        <div class="white"></div>
        <div class="white"></div>
        <div></div>
        <div class="white"></div>
        <div></div>
        <div></div>
        <div class="white"></div>
        <div></div>
        <div class="white"></div>
    </div>


</body>
</html>
