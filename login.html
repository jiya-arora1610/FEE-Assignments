<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Form</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }

        .bg1 {
            height: 100vh;
            background: #111; 
            display: flex;
            justify-content: center;
            align-items: center; 
        }

        .thebox {
            background: linear-gradient(135deg, #2c3e50, #000000);
            padding: 2.5rem; 
            border-radius: 0.9375rem; 
            border: 0.0625rem solid rgba(255, 255, 255, 0.1); 
            color: white;
            width: 20rem; 
        }

        .line {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem; 
            position: relative; 
        }

        .line input {
            flex: 1;
            padding: 0.625rem; 
            border-radius: 0.3125rem; 
            border: none;
            outline: 0.125rem solid transparent; 
            transition: 0.3s;
            font-size: 1rem; 
        }

        .line input:focus {
            outline: 0.125rem solid cyan; 
        }

        .icon-thing {
            margin-left: 0.625rem; 
            cursor: pointer; 
            color: cyan;
            font-weight: bold;
            font-size: 1.1rem;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        
        .msg {
            display: none; 
            position: absolute;
            bottom: 1.5rem; 
            right: 0;
            background: #333333;
            color: #ffffff;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            border: 0.0625rem solid #555555;
            font-size: 0.75rem; 
            font-family: Arial, sans-serif; 
            white-space: nowrap;
            z-index: 10;
        }

        
        .icon-thing:hover .msg {
            display: block; 
        }

        .pic-div {
            height: 100vh;
            background: url("22D576E6-338B-41B5-A994-DF97C4ECC70E.jpg") center/cover fixed;
            background-color: #333; 
        }

        .color-div {
            height: 100vh;
            background: #222;
        }

    </style>
</head>
<body>

    <div class="bg1">
        <div class="thebox">
            
            <div class="line">
                <input type="text" placeholder="Name">
            </div>

            <div class="line" style="margin-bottom: 0;">
                <input type="password" placeholder="Password">
                
                <span class="icon-thing">ⓘ
                    <span class="msg">Password should be minimum of 8 characters</span>
                </span>
            </div>

        </div>
    </div>

    <div class="pic-div"></div>
    <div class="color-div"></div>
    <div class="pic-div"></div>

</body>
</html>
