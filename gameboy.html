<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="gameboy.css">
</head>
<body>
    
    <div class="base">
        <div class="screenplate">
            <div class = "screen">
                <img class = "mario" src="images.png" height="15px">
            </div>
        </div>

        <div class="controls">
            <div class="cross-btn">
                <div class="vertical"></div>
                <div class="horizontal"></div>
                <div class="up-hit"></div>
                <div class="down-hit"></div>
                <div class="left-hit"></div>
                <div class="right-hit"></div>
            </div>

            <div class="ab-buttons">
                <div class="round-btn"></div>
                <div class="round-btn"></div>
            </div>
        </div>
        
    </div>
</body>
</html>
